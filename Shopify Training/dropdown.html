<!DOCTYPE html>
<html>
    <head>
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
        ></script>
    </head>
            <link rel="stylesheet" href="style/dropdown.css" />
    </head>
    <body>
            <div x-data="dropdown" class="dropdown">
                <button @click="toggle()" class="btn-dropdown">Dropdown button</button>
                <div class="dropdown__menu" x-show="isOpen" x-transition>
                    <ul>
                        <li>Test 1</li>
                        <li>Test 2</li>
                        <li>Test 3</li>
                    </ul>
                </div>
            </div>
         <script>
            document.addEventListener("alpine:init", () => {
                Alpine.data("dropdown", () => ({
                    isOpen: false,
                   toggle(){
                    this.isOpen = !this.isOpen;
                   }
                }))
            })
        </script>
    </body>
</html>
