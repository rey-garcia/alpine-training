            <div class="row">

                <div class="box" x-data="box()"></div>
                <div class="box" x-data="box()"></div>
                <div class="box" x-data="box()"></div>
                <div class="box" x-data="box()"></div>
            </div>
        </div>
        <script>
            document.addEventListener("alpine:init", () => {
                gsap.registerPlugin(ScrollTrigger)

                Alpine.data("box", (data = {}) => ({
                    animate: data.animate ?? false,
                    bgColor: data.bgColor ?? null,
                    bgImage: data.bgImage ?? null,

                    init() {
                        if (this.bgColor) {
                            this.$el.style.backgroundColor = this.bgColor
                        }

                        if (this.bgImage) {
                            this.$el.style.backgroundImage = `url(${this.bgImage})`
                            this.$el.style.backgroundSize = "cover"
                            this.$el.style.backgroundPosition = "center"
                        }

                        if (this.animate) {
                            gsap.to(this.$el, {
                                scale: 2,
                                scrollTrigger: {
                                    trigger: this.$el,
                                    start: "center center",
                                    once: true,
                                },
                            })
                        }
                    },
                }))
            })
        </script>
    </body>
</html>
