<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="style/carousel.css" />
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
        ></script>
        <title>Carousel</title>
    </head>
    <body>
        <div class="carousel__wrapper" x-data="carousel()">
            <div class="carousel">
                <button @click="prev()">&lt;</button>

                <div
                    class="carousel__container"
                    :style="`--current-index: ${current}`"
                >
                    <div class="carousel__tracker">
                        <div class="carousel__content">Slide 1</div>
                        <div class="carousel__content">Slide 2</div>
                        <div class="carousel__content">Slide 3</div>
                    </div>
                </div>

                <button @click="next()">&gt;</button>
            </div>
        </div>

        <script>
            document.addEventListener("alpine:init", () => {
                Alpine.data("carousel", () => ({
                    current: 0,
                    total: 3,

                    next() {
                        if (this.current < this.total - 1) {
                            this.current++
                        }
                    },

                    prev() {
                        if (this.current > 0) {
                            this.current--
                        }
                    },
                }))
            })
        </script>
    </body>
</html>
